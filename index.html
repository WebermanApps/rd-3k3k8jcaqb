<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="robots" content="noindex,nofollow">
<title>Research Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Khand:wght@600;700&family=Hind:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--pri:#171717;--sec:#f5f5f5;--mut:#737373;--bd:#e5e5e5;--love:#dc2626;--yes:#16a34a;--warn:#d97706;--accent:#0B6E4F;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Hind,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Khand,sans-serif;font-weight:700;line-height:1.1;letter-spacing:-.01em;margin:0}
h1{font-size:2.6rem}h2{font-size:1.5rem;margin-bottom:.6rem;display:flex;gap:8px;align-items:center}
main{max-width:1100px;margin:0 auto;padding:24px 16px 120px}
@media(min-width:1440px){main{max-width:1280px}}
@media(min-width:2000px){main{max-width:1680px}}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
.grid{display:grid;gap:16px;margin-top:20px}@media(min-width:768px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}
@media(min-width:1440px){.grid{grid-template-columns:1fr 1fr 1fr}.wide{grid-column:1/-1}}
.card{border:1px solid var(--bd);border-radius:.75rem;padding:18px;background:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--yes);display:inline-block}
a.app{display:flex;justify-content:space-between;align-items:center;min-height:44px;border:2px solid var(--pri);padding:10px 14px;color:var(--fg);text-decoration:none;font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
a.app svg{transition:transform .18s var(--ease)}a.app:hover svg{transform:translateX(3px)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:999px;padding:4px 10px;margin:3px;font-size:14px}
.row{border-top:1px solid var(--bd)}.row summary{list-style:none;cursor:pointer;min-height:44px;display:flex;gap:10px;align-items:center;padding:8px 4px}
.row summary::-webkit-details-marker{display:none}.row summary .chev{margin-left:auto;transition:transform .18s}.row[open] .chev{transform:rotate(90deg)}
.row ul{margin:0 0 12px;padding-left:22px;color:#262626}.date{font-family:Khand;font-weight:700;min-width:92px}
ul.plain{margin:0;padding-left:18px}
.mw-hover{transition:transform 180ms var(--ease),box-shadow 180ms var(--ease),background-color 180ms var(--ease)}
.mw-hover:hover,.mw-hover:focus-visible{transform:translateY(-1px) scale(1.02);box-shadow:0 6px 18px rgba(10,10,10,.12)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;transform:none!important}}
footer{text-align:center;padding:24px 16px 96px;font-size:13px}footer a{color:var(--mut);text-decoration:none;display:inline-block;min-height:44px;line-height:44px;padding:0 8px}

/* Update / report bar */
#report-bar{display:none;border-bottom:1px solid var(--bd);background:var(--sec)}
#report-bar.show{display:block}
.report-inner{max-width:1100px;margin:0 auto;padding:14px 16px 16px;border-left:3px solid var(--accent)}
@media(min-width:1440px){.report-inner{max-width:1280px}}
@media(min-width:2000px){.report-inner{max-width:1680px}}
.report-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:6px}
.report-type{font-family:Khand,sans-serif;font-weight:700;font-size:1.15rem;letter-spacing:-.01em;color:var(--fg)}
.report-time{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
.report-body{font-size:15px;line-height:1.45;color:#262626}
.report-body p{margin:0 0 4px}.report-body p:last-child{margin-bottom:0}
.report-group{margin-top:8px}.report-group:first-child{margin-top:0}
.report-cat{font-family:Khand,sans-serif;font-weight:700;font-size:.95rem;color:var(--accent);margin:0 0 2px}
.report-group ul{margin:0;padding-left:18px}.report-group li{margin:2px 0}
@media(max-width:400px){h1{font-size:2.1rem}.report-type{font-size:1.05rem}}

@media(min-width:1440px){.grid .fill3{grid-column:auto}}
/* Focus rings, large monitors, TVs */
a:focus-visible,summary:focus-visible,button:focus-visible{outline:3px solid #171717;outline-offset:3px}
.card,.app,.chip{overflow-wrap:anywhere}
@media(min-width:1900px){html{font-size:20px}body{font-size:20px}main{max-width:none;padding:3vh 5vw 140px}.report-inner{max-width:none;padding:18px 5vw}
 h1{font-size:3.4rem}h2{font-size:1.9rem}.lbl,.report-time{font-size:15px}a.app{font-size:17px;min-height:60px}.chip{font-size:18px}.report-body{font-size:21px}.report-type{font-size:1.6rem}
 .grid{grid-template-columns:repeat(3,1fr);gap:24px}.card{padding:28px}footer{font-size:17px}#mwShare{font-size:16px!important;min-height:56px!important}}
@media(min-width:3000px){html,body{font-size:36px}h1{font-size:3.6rem}.lbl,.report-time{font-size:26px}a.app{font-size:30px;min-height:96px}.chip{font-size:32px}.report-body{font-size:38px}.card{padding:48px;border-width:2px}.grid{gap:40px}footer{font-size:30px}footer a{min-height:80px;line-height:80px}#mwShare{font-size:28px!important;min-height:96px!important;padding:0 32px!important;right:5vw!important;bottom:5vh!important}h2 svg{width:32px;height:32px}}
</style></head><body>
<div id="report-bar" aria-live="polite"><div class="report-inner">
  <div class="report-head"><span class="report-type" id="rtype"></span><span class="report-time" id="rtime"></span></div>
  <div class="report-body" id="rbody"></div>
</div></div>
<main>
<div class="lbl">Agent Dashboard · Formerly Vision</div>
<h1>Research Command Center</h1>
<p id="role" style="max-width:62ch"></p>
<div class="grid">
<section class="card mw-hover"><h2><span class="dot"></span>Status</h2><p id="status" style="margin:0"></p><p class="lbl" style="margin:.6rem 0 0" id="upd"></p></section>
<section class="card mw-hover"><h2><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Routine</h2><p id="routine" style="margin:0"></p></section>
<section class="card wide fill3"><h2>Apps</h2><div id="apps"></div></section>
<section class="card mw-hover"><h2><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>Decisions Max Owes</h2><ul class="plain" id="dec"></ul></section>
<section class="card mw-hover"><h2>Open Items</h2><ul class="plain" id="open"></ul></section>
<section class="card wide fill3"><h2 id="vt"></h2><div id="votes"></div></section>
<section class="card wide"><h2>Recent Research Days</h2><div id="days"></div></section>
</div></main>
<footer><a class="mw-hover" href="https://maxweberman.com">Built by Max Weberman</a></footer>
<script>
const I={Love:'<svg width="14" height="14" viewBox="0 0 24 24" fill="#dc2626"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/></svg>',Yes:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg>',No:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"/></svg>'};
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
function renderReport(r){
  if(!r||!Array.isArray(r.items)||!r.items.length)return;
  const type=(r.type==='Evening'?'Evening':'Morning')+' Report';
  $('rtype').textContent=type;
  $('rtime').textContent=r.time||'';
  const items=r.items;
  const hasCat=items.some(i=>i&&i.category);
  const group=hasCat&&items.length>2;
  if(!group){
    $('rbody').innerHTML=items.map(i=>'<p>'+e(i.text||'')+'</p>').join('');
  }else{
    const order=[],map={};
    items.forEach(i=>{
      const c=(i.category&&String(i.category).trim())||'Other';
      if(!map[c]){map[c]=[];order.push(c)}
      map[c].push(i.text||'');
    });
    $('rbody').innerHTML=order.map(c=>'<div class="report-group"><div class="report-cat">'+e(c)+'</div><ul>'+map[c].map(t=>'<li>'+e(t)+'</li>').join('')+'</ul></div>').join('');
  }
  $('report-bar').classList.add('show');
}
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{
renderReport(d.report);
$("role").textContent=d.role;$("status").textContent=d.status;$("upd").textContent='Updated '+d.updated;$("routine").textContent=d.routine;
$("apps").innerHTML=d.apps.map(a=>'<a class="app mw-hover" href="'+e(a.url)+'">'+e(a.title)+' <span style="text-transform:none;letter-spacing:0;font-weight:400;color:#737373;flex:1;margin-left:10px">'+e(a.desc)+'</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>').join('');
$("dec").innerHTML=d.decisions.map(x=>'<li><b>'+e(x.title)+'</b> <span style="color:#737373">'+e(x.note)+'</span></li>').join('');
$("open").innerHTML=d.open.map(x=>'<li>'+e(x)+'</li>').join('');
$("vt").textContent="Max's Votes: "+d.votes.title;
$("votes").innerHTML=['Love','Yes','No'].map(k=>'<div style="margin:6px 0"><span class="lbl">'+k+'</span><br>'+d.votes[k].map(t=>'<span class="chip">'+I[k]+e(t)+'</span>').join('')+'</div>').join('');
$("days").innerHTML=d.days.map(x=>'<details class="row"><summary class="mw-hover"><span class="date">'+e(x.date)+'</span><span>'+e(x.title)+'</span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></summary><p style="margin:0 0 6px 4px"><span class="lbl">Best Pick</span> '+e(x.best)+'</p><ul>'+x.items.map(i=>'<li>'+e(i)+'</li>').join('')+'</ul></details>').join('');
window.mwShareSummary=()=>'Research dashboard, updated '+d.updated;});
</script>
<style id="mw-share-css">
:root{--mw-ease:cubic-bezier(.2,.8,.2,1);--mw-dur:180ms}
.mw-hover{transition:transform var(--mw-dur) var(--mw-ease),box-shadow var(--mw-dur) var(--mw-ease),background-color var(--mw-dur) var(--mw-ease)}
.mw-hover:hover,.mw-hover:focus-visible{transform:translateY(-1px) scale(1.03);box-shadow:0 6px 18px rgba(10,10,10,.12)}
.mw-hover:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){.mw-hover,.mw-hover:hover{transition:none;transform:none}}
#mwShare{position:fixed;right:12px;bottom:calc(12px + var(--mw-share-offset,0px) + env(safe-area-inset-bottom));z-index:50;min-height:44px;padding:0 16px;background:#fff;color:#171717;border:1px solid #171717;border-radius:0;font-family:Hind,system-ui,sans-serif;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:8px}
#mwShareMsg{position:fixed;right:12px;bottom:calc(64px + var(--mw-share-offset,0px));z-index:51;background:#fff;border:1px solid #e5e5e5;color:#0a0a0a;padding:6px 10px;font:13px Hind,system-ui,sans-serif;display:none}
</style>
<button id="mwShare" class="mw-hover" type="button" aria-label="Share this app"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v13"/><path d="M7 8l5-5 5 5"/></svg>Share</button><div id="mwShareMsg">Copied</div>
<script>
(function(){const b=document.getElementById('mwShare'),msg=document.getElementById('mwShareMsg');
b.onclick=async()=>{const url=location.href.split('#')[0];const title=document.title;const sum=(window.mwShareSummary&&window.mwShareSummary())||'';const text=(sum?sum+'\n':'')+title;
 if(navigator.share){try{await navigator.share({title,text,url});return}catch(e){if(e&&e.name=='AbortError')return}}
 if(/iPhone|iPad|Android/i.test(navigator.userAgent)){location.href='sms:?&body='+encodeURIComponent(text+' '+url);return}
 try{await navigator.clipboard.writeText(text+' '+url)}catch(e){const t=document.createElement('textarea');t.value=text+' '+url;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
 msg.style.display='block';setTimeout(()=>msg.style.display='none',1800)}})();
</script>
</body></html>
